
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, production]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: deployment
          persist-credentials: false

      - name: Copy to live path
        run: |
          rsync -rlt --exclude='.git/' \
            "$GITHUB_WORKSPACE/deployment/" \
            "$HOME/quiz-tool/"

      - name: Restart service
        run: sudo systemctl restart quiz.service
