{% macro icon(name, class_name='control-icon') -%}
<svg class="{{ class_name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'person' %}<circle cx="12" cy="7" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2Z"/>
{% elif name == 'people' %}<circle cx="9" cy="7" r="3"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M17 4a3 3 0 0 1 0 6M20 21v-2a7 7 0 0 0-3-5.7"/>
{% elif name == 'target' %}<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="m12 12 9-9m-4 0h4v4"/>
{% elif name == 'sidebar-right' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/><path class="sidebar-pane" d="M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4Z" stroke="none"/>
{% elif name == 'chart' %}<path d="M5 20v-7m7 7V4m7 16V9"/>
{% elif name == 'chevron' %}<path d="m6 9 6 6 6-6"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% endif %}</svg>
{%- endmacro %}
